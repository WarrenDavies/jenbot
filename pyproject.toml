[project]
name = "jenbot"
version = "1.0.0"
description = ""
authors = [{name = "Warren Davies"}]
homepage = "https://github.com/WarrenDavies/jenbot"
repository = "https://github.com/WarrenDavies/jenbot"
readme = "README.md"
requires-python = ">=3.10,<3.15"
packages = [{include = "jenbot", from = "src"}]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
llama-cpp-python = ">=0.3.16,<0.4.0"
textjenerator = {path = "../text-jenerator"}
fastapi = {extras = ["standard"], version = "^0.128.0"}
requests = "^2.32.5"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"