data_connection:
  output_data_type: "sqlite3"
  data_source_location: "./data/interviews.sqlite"

output_folders:
  tts: "./outputs/tts/"
  feedback: "./outputs/interviews"

router:
  generator_config:
    model: "llama-cpp"
    model_path: "models/Llama-3.2-3B-Instruct-Q4_K_M.gguf"
    device: "cpu"
    dtype: "float32"
    number_of_threads: 8
    n_gpu_layers: -1
    verbose_warnings: False
    max_context_size: 4096
    max_tokens_per_response: 256
    temperature: 0 
    top_p: 0.9
    top_k: 10

bot:
  name: "InterviewBot"
  interviewer:
    name: "Tony Stank"
    interviewer_role: "CEO and Chief Inventor"
    organisation: "Stank Industries"
    vacancy: "Innovation assistant"
    competencies:
      Problem Solving and Decision Making:
        - "Engineer functional cold-fusion arc reactors in high-stress environments (e.g., caves) using literal boxes of scraps."
        - "Debug flight stabilization actuators while falling at terminal velocity; ignore JARVIS's 'terabytes of calculations' warnings."
        - "Apply the 'Run Before You Can Walk' framework to bypass traditional R&D bottlenecks."
        - "Identify and neutralize 'Galaga-playing' distractions within high-stakes command centers."
      Technical Implementation and Quality:
        - "Develop iterative hardware versions (Mark I through LXXXV) to address recurring 'icing' and 'moon-thrown-at-face' edge cases."
        - "Maintain a 400% power capacity through lightning-based charging solutions provided by unpredictable Asgardian consultants."
        - "Architect high-fidelity AI systems (JARVIS, FRIDAY) with enough snark to handle complex emotional labor."
        - "Clean up planetary-scale technical debt resulting from rogue 'Global Defense' experiments (see: Ultron Incident)."
      Communication and Stakeholder Engagement:
        - "Explain thermonuclear astrophysics to non-technical audiences over the course of a single evening."
        - "Manage high-ego cross-functional teams, including WWII veterans, green rage monsters, and 'wizards' from Bleecker Street."
        - "Tailor negotiation styles ranging from 'Genius Billionaire Playboy Philanthropist' to 'I am Iron Man'."
        - "Provide constructive feedback to interns (e.g., 'Don't do anything I would do, and definitely don't do anything I wouldn't do')."
      Ownership and Delivery:
        - "Take 100% responsibility for global security, even when the 'Super Secret Boy Band' isn't on board."
        - "Deliver results on 'Earth is Closed Today' deadlines despite sudden alien incursions."
        - "Sacrifice personal leisure (and vital signs) to ensure project completion and a 'Happy Ending' for the remaining 50% of stakeholders."
        - "Prioritize cheeseburgers and shawarma as essential post-sprint retrospective fuel."
  generator_config:
    backend: "transformers"
    model_name: "meta-llama/Llama-3.2-3B-Instruct"
    model_path: "meta-llama/Llama-3.2-3B-Instruct"
    trust_remote_code: False
    device: "cuda"
    dtype: "float16"
    verbose_warnings: False
    max_context_size: 4096
    max_new_tokens: 1024
    do_sample: True
    temperature: 0.8
    top_p: .9
    top_k: 40
  memory:
    max_messages_in_context: 7
  tts:
    output_path: "./outputs/audio"
    generator_config:
      model: "kokoro"
      text: ""
      lang: "a"
      voice: "af_heart"

user:
  location:
    long: 51.53
    lat: -0.14