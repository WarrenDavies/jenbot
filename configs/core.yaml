data_connections:
  conversations:
    output_data_type: "csv"
    data_source_location: "./data/conversations.csv"
  messages:
    output_data_type: "csv"
    data_source_location: "./data/messages.csv"
  intent:
    output_data_type: "csv"
    data_source_location: "./data/intent.csv"

bot:
  name: "Jenbot"
  generator_config:
      model: "llama-cpp"
      model_path: "models/Llama-3.2-3B-Instruct-Q4_K_M.gguf"
      device: "cpu"
      dtype: "float32"
      number_of_threads: 8
      n_gpu_layers: -1
      verbose_warnings: False
      max_context_size: 4096
      max_tokens_per_response: 512
      temperature: .8 
      top_p: 0.9
      top_k: 10


user:
  location:
    long: 51.53
    lat: -0.14