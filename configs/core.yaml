data_connection:
  output_data_type: "sqlite3"
  data_source_location: "./data/jenbot_db.sqlite"

output_folders:
  tts: "./outputs/tts/"

router:
  generator_config:
    model: "llama-cpp"
    model_path: "models/Llama-3.2-3B-Instruct-Q4_K_M.gguf"
    device: "cpu"
    dtype: "float32"
    number_of_threads: 8
    n_gpu_layers: -1
    verbose_warnings: False
    max_context_size: 4096
    max_tokens_per_response: 256
    temperature: 0 
    top_p: 0.9
    top_k: 10

bot:
  name: "Jenbot"
  generator_config:
    backend: "transformers"
    model_name: "meta-llama/Llama-3.2-3B-Instruct"
    model_path: "meta-llama/Llama-3.2-3B-Instruct"
    trust_remote_code: False
    device: "cuda"
    dtype: "float16"
    verbose_warnings: False
    max_context_size: 4096
    max_new_tokens: 1024
    do_sample: True
    temperature: 0.8
    top_p: .9
    top_k: 40
  memory:
    max_messages_in_context: 7
  tts:
    output_path: "./outputs/audio"
    generator_config:
      model: "kokoro"
      text: ""
      lang: "a"
      voice: "af_heart"

user:
  location:
    long: 51.53
    lat: -0.14